# 依賴更新自動化（CLAUDE.md 資安要求「定期檢查已知漏洞」的機制面）。
# npm：週期檢查 package.json / lock 的更新與 security advisory；
# github-actions：跟進 workflow 引用的 action 新版（本 repo 以官方 action
# 的 major tag 釘選——Dependabot 讓 tag 引用持續跟上）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 預設上限是 5 個 open 的 version-update PR，達標後 Dependabot 就不再開新
    # PR。2026-07-31 到 08-28 的四週停擺正是撞上這個上限（astro / prettier /
    # playwright / @astrojs/check / typescript 剛好五個）。提高到 10 讓「暫時
    # 沒空處理」不會直接變成「連新版都不知道」。
    open-pull-requests-limit: 10
    groups:
      # dev 工具的 minor / patch 合成一個 PR：它們不進 production bundle、
      # 也不在 ci.yml `npm audit --omit=dev` 的範圍內，逐個開 PR 只是佔額度。
      # production 依賴與任何 major 仍各自單獨開 PR，維持逐一評估。
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
